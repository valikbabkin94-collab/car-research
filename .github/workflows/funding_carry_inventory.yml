name: FUNDING CARRY saved-data inventory
on:
  push:
    branches: [research/funding-carry]
    paths: [.github/workflows/funding_carry_inventory.yml]
permissions: {contents: write, actions: read}
jobs:
  inventory_no_pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: s1-s3-history-inputs-results-checkpoint
          run-id: '43874717889'
          path: source
          github-token: ${{ github.token }}
      - name: Funding coverage, intervals, checksums; no PnL
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/funding_carry_20261117/inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funding-carry-inventory-no-pnl
          path: research/funding_carry_20261117/DATA_INVENTORY_FUNDING.json
          retention-days: 14
