name: B all2113 allocator audit from saved paths only
on:
  push:
    branches: [research/conveyor-20261118]
    paths: [.github/workflows/pf_raw_allocator_audit_20261118.yml]
permissions: {contents: write}
jobs:
  B_RAW_and_model_causality_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6
      - run: python -u research/pf_market_conveyor_20261118/raw_allocator_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: B-all2113-conveyor-and-model-causality-audit
          path: research/pf_market_conveyor_20261118/raw_allocator_audit/
      - env:
          GH_TOKEN: ${{ github.token }}
          LAB_OUTPUT: research/pf_market_conveyor_20261118/raw_allocator_audit
        run: python research/pf_market_conveyor_20261118/publish.py
