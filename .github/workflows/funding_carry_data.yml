name: FUNDING CARRY public source preparation no PnL
on:
  push:
    branches: [research/funding-carry]
    paths: [.github/workflows/funding_carry_data.yml]
permissions: {contents: write, actions: read}
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2, 3]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          name: s1-s3-history-inputs-results-checkpoint
          run-id: '43874717889'
          path: source
          github-token: ${{ github.token }}
      - name: Verified public prices and only missing funding months
        env: {DATA_SHARD: '${{ matrix.shard }}'}
        run: python -u research/funding_carry_20261117/acquire.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funding-carry-coins${{ matrix.shard }}
          path: work/coins
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funding-carry-data-inventory${{ matrix.shard }}
          path: research/funding_carry_20261117/data_shard${{ matrix.shard }}
          retention-days: 14
      - name: Save source registry without PnL
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_OUTPUT: research/funding_carry_20261117/data_shard${{ matrix.shard }}
        run: python research/funding_carry_20261117/publish.py
