name: Scenario factory isolated research checks
on:
  push:
    branches: [research/scenario-factory]
    paths: [.github/workflows/scenario_factory_research.yml, research/scenario_factory_20261116/**, tests/**]
permissions: {contents: read}
jobs:
  offline_research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6
      - run: python tools/scan_publication.py
      - run: python -m unittest discover -s tests -v
      - run: python research/scenario_factory_20261116/backtest_s5_paired_fees.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-s5-paired-accounting-results
          path: research/scenario_factory_20261116/S5_RESULTS
          retention-days: 7
