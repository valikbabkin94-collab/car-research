name: Verify source P1-P3 semantics without repeating OLEG or unaffected outcomes
on:
  push:
    branches: [research/oleg-and-private-20261118]
    paths: [.github/workflows/oleg_private_audit.yml]
permissions: {contents: write, actions: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6 pytest==8.4.2
      - run: PYTHONPATH=research/oleg_private_20261118 python -m pytest -q research/oleg_private_20261118/test_parser.py research/oleg_private_20261118/test_engine.py
      - name: Wait for source job completion only
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import os,json,urllib.request,time
          u='https://api.github.com/repos/valikbabkin94-collab/car-research/actions/runs/44270512713'
          for k in range(360):
              req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:d=json.load(f)
              if d['status']=='completed':print('SOURCE_FINISHED',d['conclusion']);break
              if k%15==0:print('SOURCE_PENDING',flush=True)
              time.sleep(20)
          else:raise RuntimeError('SOURCE_RUN_NOT_COMPLETE')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: '*_shard*'
          run-id: '44270512713'
          path: original_results
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: manager-all-verified-market-cache
          run-id: '44092086995'
          path: work/market/m1
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: s1-s3-history-inputs-results-checkpoint
          run-id: '43874717889'
          path: source
          github-token: ${{ github.token }}
      - name: Reuse unchanged outcomes and audit only potentially affected BE paths
        run: PYTHONPATH=research/oleg_private_20261118 python -u research/oleg_private_20261118/conformance_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oleg-private-source-conformance
          path: |
            research/oleg_private_20261118/verified_rows
            research/oleg_private_20261118/verified_final
          retention-days: 90
      - env:
          GH_TOKEN: ${{ github.token }}
          LAB_OUTPUT: research/oleg_private_20261118/verified_rows
        run: python research/oleg_private_20261118/publish.py
      - env:
          GH_TOKEN: ${{ github.token }}
          LAB_OUTPUT: research/oleg_private_20261118/verified_final
        run: python research/oleg_private_20261118/publish.py
