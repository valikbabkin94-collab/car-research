name: Public Round4 fixed-protocol collection and replay
on:
  push:
    branches: [research/round4-cont]
    paths: [.github/workflows/car_research_round4_pipeline.yml]
  workflow_dispatch:
    inputs:
      resume_run:
        description: Previous PUBLIC run with m15-final shards, blank for authorized first rebuild
        required: false
        default: ''
permissions: {contents: read, actions: read}
concurrency:
  group: public-round4-fixed-source
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - run: python tools/scan_publication.py
      - run: python tools/verify_migration.py
      - run: python research/web_ideas_20261114/unblock_20261114/resume_503/test_network.py
      - run: python -m unittest discover -s tests -v
  collect_1:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 270
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: {shard: [0, 1]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - uses: actions/download-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run != '' }}
        with:
          name: m15-final-${{ matrix.shard }}
          path: m15-${{ matrix.shard }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Same collector and parameters, resume only missing files
        run: python tools/run_collection_pass.py --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-pass1-${{ matrix.shard }}
          path: m15-${{ matrix.shard }}
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-pass1-${{ matrix.shard }}
          path: |
            m15-${{ matrix.shard }}/CHECKPOINT.json
            m15-${{ matrix.shard }}/HTTP_LOG.jsonl
            parity
          retention-days: 7
  collect_2:
    needs: collect_1
    runs-on: ubuntu-latest
    timeout-minutes: 270
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: {shard: [0, 1]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: m15-pass1-${{ matrix.shard }}
          path: m15-${{ matrix.shard }}
      - name: Same collector and parameters, resume only missing files
        run: python tools/run_collection_pass.py --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-pass2-${{ matrix.shard }}
          path: m15-${{ matrix.shard }}
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-pass2-${{ matrix.shard }}
          path: |
            m15-${{ matrix.shard }}/CHECKPOINT.json
            m15-${{ matrix.shard }}/HTTP_LOG.jsonl
            parity
          retention-days: 7
  collect_3:
    needs: collect_2
    runs-on: ubuntu-latest
    timeout-minutes: 270
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: {shard: [0, 1]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: m15-pass2-${{ matrix.shard }}
          path: m15-${{ matrix.shard }}
      - name: Same collector and parameters, resume only missing files
        run: python tools/run_collection_pass.py --shard ${{ matrix.shard }}
      - name: Fail closed on known-reference discrepancy
        run: python tools/finalize_market_data.py --root m15-${{ matrix.shard }} --out parity --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-final-${{ matrix.shard }}
          path: m15-${{ matrix.shard }}
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-pass3-${{ matrix.shard }}
          path: |
            m15-${{ matrix.shard }}/CHECKPOINT.json
            m15-${{ matrix.shard }}/HTTP_LOG.jsonl
            parity
          retention-days: 7
  replay:
    needs: collect_3
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with: {pattern: 'm15-final-*', path: market}
      - uses: actions/download-artifact@v4
        with: {pattern: 'diagnostics-pass3-*', path: checks}
      - name: Recheck final manifests before using market history
        run: |
          python tools/finalize_market_data.py --root market/m15-final-0 --out parity --shard 0
          python tools/finalize_market_data.py --root market/m15-final-1 --out parity --shard 1
          python tools/require_complete.py
      - name: Original R1 frozen 0015 entry and 1000 controls
        run: python research/round4_20261115/C/continuation_20261116/replay_r1h.py --hourly market --funding inputs/funding --out results/R1_15M --controls 1000 --interval 15m
      - name: Original G3 real 15m confirmations
        run: |
          python tools/prepare_funding_view.py --source inputs/funding --out view
          python research/round4_20261115/C/continuation_20261116/extract_original_g3.py --hourly market --pit inputs/pit --data view --out results/G3_opportunities
          python tools/build_g3_funding_plan.py --opportunities results/G3_opportunities/G3_15M_OPPORTUNITIES_NOT_TRADES.jsonl.gz --out results/G3_funding_plan.json
      - name: Address only funding required by actual original15m opportunities
        run: python research/round4_20261115/C/continuation_20261116/restore_funding.py --plan results/G3_funding_plan.json --seed inputs/funding/symbols --out results/G3_funding --deadline-seconds 1200
      - name: Original G3 guarded descriptive portfolio, no unknown meme substitution
        run: python research/round4_20261115/C/continuation_20261116/replay_g3h.py --hourly market --funding results/G3_funding --opportunities results/G3_opportunities/G3_15M_OPPORTUNITIES_NOT_TRADES.jsonl.gz --out results/G3_15M --interval 15m
      - name: Next queue, N4 only missing31 selected windows
        run: python research/round4_20261115/C/continuation_20261116/restore_funding.py --plan research/round4_20261115/neutral_20261116/N4_REQUIRED_FUNDING_PLAN.json --seed inputs/funding/symbols --out results/N4_missing_funding --deadline-seconds 900
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: original15m-results-and-funding, path: results, retention-days: 7}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: public-final-data-parity, path: parity, retention-days: 7}
  publish_research_report:
    if: ${{ always() && github.ref_name == 'research/round4-cont' }}
    needs: [collect_3, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/round4-cont, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: original15m-results-and-funding, path: report-input}
      - run: python tools/write_run_report.py --results report-input --out reports/run-${{ github.run_id }}
      - run: python tools/scan_publication.py --out reports/run-${{ github.run_id }}/PRE_PUSH_SCAN.json
      - name: Publish research report only, never main or another repository
        run: |
          git config user.name "CAR Research Results"
          git config user.email "research-results@users.noreply.github.com"
          git add -- reports/run-${{ github.run_id }}
          git diff --cached --quiet && exit 0
          git commit -m "research: public fixed-protocol results run${{ github.run_id }}"
          python tools/scan_publication.py
          git push origin HEAD:research/round4-cont
