name: C FUNDING CARRY completed results integrity
on:
  push:
    branches: [research/funding-carry]
    paths: [.github/workflows/funding_carry_saved_audit_20261118.yml]
permissions: {contents: write}
jobs:
  C_saved_carry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/funding_carry_20261117/audit_20261118/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: C-FUNDING-CARRY-saved-result-audit
          path: research/funding_carry_20261117/audit_20261118/
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name car-research-actions
          git config user.email car-research-actions@users.noreply.github.com
          git add research/funding_carry_20261117/audit_20261118
          git commit -m 'research: C carry saved result integrity checkpoint [skip ci]'
          python - <<'PYCODE'
          import os,subprocess,base64
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git','-c','http.extraHeader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:research/funding-carry'],check=True,stdout=subprocess.DEVNULL)
          PYCODE
