# Fixed entries; reverse side never inherits an unverified maker fill.
name: Fixed-entry manager all scenarios full audit v1.1 frozen cutoff and accounting verified
on:
  push:
    branches: [research/manager-all-scenarios]
    paths: [.github/workflows/manager_all_scenarios.yml]
permissions: {contents: write, actions: read}
concurrency:
  group: manager-all-scenarios
  cancel-in-progress: false
jobs:
  full_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - run: python -m unittest discover -s research/manager_all_scenarios_20261117/tests -v
      - run: python tools/scan_publication.py
      - uses: actions/download-artifact@v4
        with:
          name: manager-all-verified-market-cache
          path: work/market/m1
          run-id: '44087096459'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: s1-s3-history-inputs-results-checkpoint
          path: source
          run-id: '43874717889'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: manager-all-code-results-checkpoints
          path: prior_run
          run-id: '44087096459'
          github-token: ${{ github.token }}
      - name: Complete fixed input audit, no new signal searches
        timeout-minutes: 85
        run: |
          python - <<'PY'
          import os,json,runpy,sys
          os.environ['CAR_RESEARCH_ASOF_MS']=str(json.load(open('prior_run/RESULTS/PARAMS.json'))['asof'])
          sys.path.insert(0,'research/manager_all_scenarios_20261117')
          runpy.run_path('research/manager_all_scenarios_20261117/execute_v1_1.py',run_name='__main__')
          PY
      - name: Verify complete outputs and write Claude handoff
        run: python research/manager_all_scenarios_20261117/finalize.py
      - name: Scan research publication
        if: always()
        id: scan
        run: python tools/scan_publication.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.scan.outcome == 'success'
        with:
          name: manager-all-code-results-checkpoints
          path: research/manager_all_scenarios_20261117
          retention-days: 14
      - name: Verify numerical cache
        if: always()
        id: cache
        run: |
          python - <<'PY'
          import hashlib,json
          import numpy as np
          from pathlib import Path
          for p in Path('work/market/m1').glob('*.npz'):
           assert hashlib.sha256(p.read_bytes()).hexdigest()==json.loads(p.with_suffix('.json').read_text())['parsed_sha256']
           with np.load(p,allow_pickle=False)as z:assert set(z.files)=={'bars'} and z['bars'].dtype.kind=='f'
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.cache.outcome == 'success'
        with:
          name: manager-all-verified-market-cache
          path: work/market/m1
          compression-level: 0
          retention-days: 14
      - name: Preserve results only in research branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name car-research-actions
          git config user.email car-research-actions@users.noreply.github.com
          git add research/manager_all_scenarios_20261117
          git commit -m 'research: all-scenario entry edge, fixed manager train selection and independent checks [skip ci]'
          python - <<'PY'
          import os,base64,subprocess
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git','-c','http.extraHeader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:research/manager-all-scenarios'],check=True,stdout=subprocess.DEVNULL)
          PY
