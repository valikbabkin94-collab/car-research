name: Frozen text cohort existing market data availability, no PnL
on:
  push:
    branches: [research/text-signals-audit]
    paths: [.github/workflows/text_signals_availability.yml]
permissions: {contents: write, actions: read}
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6
      - run: python -m unittest discover -s tests -v
      - uses: actions/download-artifact@v4
        with:
          name: channels-audit-v2-final-verified-m1-cache
          path: work/market/m1
          run-id: '43943267978'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: s1-s3-history-inputs-results-checkpoint
          path: source
          run-id: '43874717889'
          github-token: ${{ github.token }}
      - run: python research/text_signals_audit_20261116/check_saved_data.py
      - run: python tools/scan_publication.py
      - name: Save availability result without trading or price replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name car-research-actions
          git config user.email car-research-actions@users.noreply.github.com
          git add research/text_signals_audit_20261116/SAVED_DATA_AVAILABILITY.json research/text_signals_audit_20261116/CHECKPOINT.json
          git commit -m 'research: record saved market/funding availability for immutable149 text candidates, no PnL [skip ci]'
          python - <<'PY'
          import os,subprocess,base64
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git','-c','http.extraHeader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:research/text-signals-audit'],check=True,stdout=subprocess.DEVNULL)
          PY
