name: Text signals source audit checks, no PnL or trading
on:
  push:
    branches: [research/text-signals-audit]
    paths: [.github/workflows/text_signals_checks.yml]
permissions: {contents: read}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
      - run: python tools/scan_publication.py
