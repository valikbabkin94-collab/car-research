name: S2 conditional document replay on saved sources only
on:
  push:
    branches: [research/s1-s3-history]
    paths: [.github/workflows/s1_s3_s2_cached_replay.yml]
permissions: {contents: write, actions: read}
jobs:
  s2_repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6
      - run: python tools/scan_publication.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/download-artifact@v4
        with:
          name: s1-s3-history-inputs-results-checkpoint
          path: results/s1-s3-history
          run-id: '43874717889'
          github-token: ${{ github.token }}
      - name: No S1 S3 reruns, no announcement recollection, only repaired S2 conditional examples
        run: python research/s1_s3_history_20261116/binance_delisting_fallback.py --saved-only
      - name: Prepare compact result and source hashes
        run: |
          python research/s1_s3_history_20261116/history.py report
          python - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('results/s1-s3-history');dst=Path('research/s1_s3_history_20261116/RESULTS')
          for pattern in ['S2_BINANCE_REPLAY*','CHECKPOINT.json','OTCHET*.md']:
           for p in src.glob(pattern):shutil.copy2(p,dst/p.name)
          PY
          python tools/scan_publication.py
      - uses: actions/upload-artifact@v4
        with:
          name: s2-conditional-repaired-results
          path: research/s1_s3_history_20261116/RESULTS
          retention-days: 7
      - name: Publish scanned conditional examples and rejections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name car-research-actions
          git config user.email car-research-actions@users.noreply.github.com
          git add research/s1_s3_history_20261116/RESULTS
          git diff --cached --quiet && exit 0
          git commit -m 'research: save S2 repaired source interpretation, blocked entries and explicit revision gap [skip ci]'
          python tools/scan_publication.py
          python - <<'PY'
          import os,subprocess,base64
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git','-c','http.extraHeader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:research/s1-s3-history'],check=True,stdout=subprocess.DEVNULL)
          PY
