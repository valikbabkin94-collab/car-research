name: PF HEDGED frozen short event path preparation and identity audit
on:
  push:
    branches: [research/pf-hedged]
    paths: [.github/workflows/pf_hedged_paths.yml]
permissions: {contents: write, actions: read}
jobs:
  frozen_paths:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2, 3]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - uses: actions/download-artifact@v4
        with:
          name: paket-part6_pf_exits
          run-id: '44134160121'
          path: baseline
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: paket-part6-coverage-resume
          run-id: '44135823920'
          path: baseline_h2
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: manager-all-code-results-checkpoints
          run-id: '44092086995'
          path: input_v1
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: manager-all-verified-market-cache
          run-id: '44092086995'
          path: work/market/m1
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: s1-s3-history-inputs-results-checkpoint
          run-id: '43874717889'
          path: source
          github-token: ${{ github.token }}
      - name: Materialize missing frozen control events and verify parent identity
        env: {PATH_SHARD: '${{ matrix.shard }}'}
        run: PYTHONPATH=research/pf_hedged_20261117 python -u research/pf_hedged_20261117/prepare_paths.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pfh-paths${{ matrix.shard }}
          path: research/pf_hedged_20261117/paths_shard${{ matrix.shard }}
          retention-days: 14
      - name: Save event paths and audit
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_OUTPUT: research/pf_hedged_20261117/paths_shard${{ matrix.shard }}
        run: python research/pf_hedged_20261117/publish.py
